; stccfix settings (place next to dinput.dll)
; Keep this file ASCII-only: the Win32 profile API reads it as ANSI.

[Display]
; 1 = start windowed (menu bar usable) / 0 = original fullscreen start
Windowed=1
; 1 = create the windowed Direct3D render target in video memory.
;     Without this, Display > Direct 3D fails in a window (D3DERR_SURFACENOTINVIDMEM).
D3DWindowedVideoMemory=1
; Window client size as a multiple of 640x480 (0 = largest that fits the monitor)
WindowScale=0
; 1 = keep the aspect ratio below while resizing the window by dragging
KeepAspect=1
; Display aspect ratio. Anything other than 4:3 enables widescreen (Direct3D mode, windowed only):
; the game's render surface is made wider, 3D fills the extra width and the 2D HUD/menus stay
; unstretched in the centre 4:3 area. Examples: 4:3 (original), 16:9, 21:9, 32:9.
; Also set dgVoodoo.conf Resolution to the same ratio.
AspectRatio=16:9
; Full-width backgrounds (sky) in widescreen:
;   extend  = keep the texture's proportions by showing more of it (needs a horizontally tiling texture)
;   stretch = stretch the 4:3 background to the full width
WideBackground=extend
; Race HUD placement in widescreen:
;   edges  = move left-side HUD groups to the left edge and right-side groups to the right edge
;   center = keep the whole HUD in the centre 4:3 area
HudAnchor=edges
; 1 = keep the size you dragged the window to when the game re-initializes graphics
RememberWindowSize=1
; 1 = borderless fullscreen: stay in windowed mode but hide the frame and menu bar and cover the whole monitor.
;     Applied at startup only (dgVoodoo does not follow a switch while running). The menu bar is hidden,
;     so set 0 when you need the Game/Display/Settings menus; F5-F9 dialogs and Alt+F4 still work.
;     Set dgVoodoo.conf Resolution to the monitor size (tools\aspect.ps1 <ratio> -RenderHeight <monitor height>).
;     Use together with DpiAware=1 when Windows display scaling is not 100%.
BorderlessFullscreen=0
; 1 = make the game DPI aware. Without it, Windows display scaling (125%, 150%...) makes the game see a
;     smaller virtual screen and stretches the window, which blurs it.
DpiAware=0

[Input]
; Device type reported to the game. It decides which modes F5 Device Settings offers.
;   auto     = as reported by Windows (a DS4 is a gamepad -> only "Game Pad")
;   joystick = unlock "Joystick"
;   wheel    = unlock "Steering Wheel (T2)"
;   gamepad  = force "Game Pad"
DeviceType=joystick
; Only show the game controllers whose name contains this text (empty = all).
; "name#N" = only the N-th match. Fanatec CSL DD: FANATEC#1 (#2 is a second, unused HID collection)
DeviceName=

; In Joystick / Steering Wheel mode the game reads one Y axis: up = accelerate, down = brake.
; 1 = build that Y axis from two separate axes (analog triggers or pedals).
;     When both are released, the stick's own Y passes through unchanged (not on wheels, whose Y is a pedal).
TriggerPedals=1
; Source axes: X, Y, Z, Rx, Ry, Rz, Slider0, Slider1. DS4: R2 = Ry, L2 = Rx
; Fanatec CSL DD as seen by the game (DirectInput 5): clutch = Y, accelerator = Z, brake = Rz
; (joylog uses DirectInput 8 and shows a different layout; check stccfix.log with LogInput=1).
; All read maximum when released, so set AccelInvert=1 and BrakeInvert=1.
AccelAxis=Ry
BrakeAxis=Rx
; 1 = the axis reads maximum when released (typical for wheel pedals)
AccelInvert=0
BrakeInvert=0
; Percent of travel ignored at the start of each pedal/trigger
PedalDeadzone=5

; Steering (X axis): center deadzone in percent, and response curve in percent
; (100 = linear, 150 = softer near center, 200 = much softer near center)
SteerDeadzone=0
SteerLinearity=100

[ForceFeedback]
; off    = hide force feedback from the game (recommended)
; native = leave it to the game. It only drives FFB on its known 1998 devices; on other wheels it just
;          starts its initial effect (odd jolts at the start of a race)
; game   = EXPERIMENTAL, not finished: report a force feedback wheel as a 1998 force feedback device the game
;          supports, so the game drives its steering force, scaled by the settings below. So far it is mostly
;          felt in collisions and fast corners. Choose "Per4mer Racing Wheel" in F5 and redo the calibration;
;          when going back to off, choose your wheel mode (e.g. Steering Wheel (T2)) again.
Mode=off
; MaxForce: cap in percent of the device's full force. Start low on direct drive wheels and hold the wheel.
; Gain: percent of MaxForce reached at a strong in-game force (fast corners). Higher values reach the cap sooner.
; Curve: response curve in percent (100 = linear; lower values strengthen the weak low-speed forces).
MaxForce=40
Gain=100
Curve=60
; 1 = reverse the force (if the wheel pulls further into a turn instead of back toward centre)
Invert=0
; 1 = allow the game to enable the device's built-in auto-centre spring
AutoCenter=0
; The game sends forces irregularly as short bursts. HoldMs: release a force the game stopped updating
; after this many milliseconds. Smoothing: milliseconds to ramp from 0 to MaxForce (0 = no smoothing).
HoldMs=100
Smoothing=80
; Milliseconds to fade forces back in after they stopped for a second (avoids a sudden kick when a
; qualifying session starts from a standstill). 0 = off.
FadeInMs=1500

[Frame]
; Frame rate limit. 0 = the game's own limiter (about 28 FPS, uneven).
; EXPERIMENTAL: N = a precise N FPS limiter. The game advances one fixed 1/30 s step per frame,
; so 30 gives the intended speed and anything else changes the game speed too.
TargetFps=0

[Debug]
; 1 = log steps, rendered/skipped frames and limiter wait per second to stccfix.log
LogFrame=0
; 1 = log DirectDraw/Direct3D calls and the game's D3D init results to stccfix.log
LogGraphics=0
; 1 = log DirectInput devices, axis properties and joystick state changes to stccfix.log
LogInput=0
; 1 = log window size changes (SetWindowPos/MoveWindow callers, WM_SIZE) to stccfix.log
LogWindow=0
