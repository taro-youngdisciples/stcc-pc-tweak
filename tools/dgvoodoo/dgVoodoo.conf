;==========================================================================
; dgVoodoo2 config for STCC (only keys changed from dgVoodoo defaults)
; Deploy with: tools\wrapper.ps1 enable
; Comments are ASCII-only on purpose (dgVoodoo parses this file as ANSI).
;==========================================================================

Version                              = 0x287

[General]
; Start windowed for testing: fullscreen requests are shown inside a window
FullScreenMode                       = false
; Keep 4:3 when scaling (widescreen is done later in our DLL, not here)
ScalingMode                          = stretched_ar
KeepWindowAspectRatio                = true
CaptureMouse                         = false

[GeneralExt]
; Report a 16bpp desktop. In windowed mode the game renders 16bpp into the
; primary surface; with a 32bpp desktop the screen came out solid green.
DesktopBitDepth                      = 16
; Temporary guard against speed-up on high refresh rate displays.
; Set back to 0 once our DLL has its own frame limiter.
FPSLimit                             = 60
; The game calls FlipToGDISurface and draws the Win32 menu bar and MFC dialogs
; (F5 Device Settings etc.) over the fullscreen surface. Without the GDI hook
; those are invisible under dgVoodoo.
SystemHookFlags                      = gdi

[DirectX]
; Native resolution first; try 2x / max_isf after the baseline works
Resolution                           = unforced
dgVoodooWatermark                    = false
AppControlledScreenMode              = true
DisableAltEnterToToggleScreenMode    = true

[DirectXExt]
; The game expects 8/16 bpp modes only
EnumeratedResolutionBitdepths        = 8,16
